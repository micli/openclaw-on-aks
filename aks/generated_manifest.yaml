apiVersion: apps/v1
kind: Deployment
metadata:
  name: openclaw
  namespace: openclaw-ns
  labels:
    app: openclaw
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openclaw
  template:
    metadata:
      labels:
        app: openclaw
    spec:
      initContainers:
        - name: init-agent-config
          image: busybox
          command: ["/bin/sh", "-c"]
          args:
            - "mkdir -p /home/node/.openclaw/agents/main/agent && echo '{\"providers\": {\"litellm\": {\"api\": \"openai-completions\", \"baseUrl\": \"http://openclaw-llmproxy-svc.openclaw-ns.svc.cluster.local:4000\", \"apiKey\": \"a212c7afa712492b8cc3ea40740e6832\", \"models\": [{\"id\": \"gpt-5.2\", \"name\": \"Azure OpenAI gpt-5.2\", \"reasoning\": false, \"input\": [\"text\", \"image\"], \"contextWindow\": 128000, \"maxTokens\": 16384}]}}, \"primary\": \"litellm/gpt-5.2\"}' > /home/node/.openclaw/agents/main/agent/models.json && chmod -R 777 /home/node/.openclaw"
          volumeMounts:
            - name: openclaw-agents
              mountPath: /home/node/.openclaw/agents
      containers:
        - name: sidecar
          image: alpine/socat
          args: ["TCP-LISTEN:18790,fork,bind=0.0.0.0", "TCP:127.0.0.1:18789"]
          ports:
            - containerPort: 18790
        - name: openclaw
          image: alpine/openclaw:latest
          ports:
            - containerPort: 18789
          env:
            - name: OPENCLAW_GATEWAY_PORT
              value: "18789"
            - name: OPENCLAW_CONFIG_PATH
              value: "/etc/openclaw/openclaw.json"
            - name: OPENCLAW_STATE_DIR
              value: "/home/node/.openclaw"
            - name: NODE_OPTIONS
              value: "--max-old-space-size=4096"
          volumeMounts:
            - name: config-volume
              mountPath: /etc/openclaw/openclaw.json
              subPath: openclaw-config.json
              readOnly: true
            - name: openclaw-data
              mountPath: /home/node/.openclaw
            - name: openclaw-agents
              mountPath: /home/node/.openclaw/agents
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "2Gi"
      volumes:
        - name: config-volume
          configMap:
            name: openclaw-openclaw-config
        - name: openclaw-data
          emptyDir: {}
        - name: openclaw-agents
          emptyDir: {}

---

apiVersion: v1
kind: Service
metadata:
  name: openclaw-svc
  namespace: openclaw-ns
spec:
  selector:
    app: openclaw
  ports:
    - protocol: TCP
      port: 80
      targetPort: 18790
  type: LoadBalancer
